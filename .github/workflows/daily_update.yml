name: daily-meta-update

# ブロスタのデイリーリセットは 08:00 UTC（17:00 JST）。
# その 40 分後に回して、マップローテーションと勝率データを取り込む。
on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch:
    inputs:
      require_stats:
        description: "実測勝率が取れなかったら失敗させる"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-meta-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: pip install -r requirements.txt

      - name: キャラアイコンを更新（新キャラ追加ぶんだけ差分取得）
        env:
          # 任意。ブラウザで Cloudflare のチャレンジを通した cf_clearance Cookie を
          # リポジトリ Secrets に入れておくと、api.brawlify.com 側も試せる。
          BRAWLIFY_COOKIE: ${{ secrets.BRAWLIFY_COOKIE }}
          BRAWLIFY_EXTRA_HEADERS: ${{ secrets.BRAWLIFY_EXTRA_HEADERS }}
        run: python scripts/download_icons.py

      - name: ルールデータを生成
        env:
          BRAWLIFY_COOKIE: ${{ secrets.BRAWLIFY_COOKIE }}
          BRAWLIFY_EXTRA_HEADERS: ${{ secrets.BRAWLIFY_EXTRA_HEADERS }}
          # 公式 API は IP 固定のキーなので Actions では基本使えない。
          # セルフホストランナーなど IP が固定できる環境向け。
          BRAWLSTARS_API_TOKEN: ${{ secrets.BRAWLSTARS_API_TOKEN }}
        run: |
          python scripts/update_meta.py \
            --rotation-out rules/rules_rotation.json \
            ${{ inputs.require_stats && '--require-stats' || '' }}

      - name: 生成物を検証
        run: python scripts/validate_rules.py rules/rules.json

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets rules data
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "chore(meta): ルールデータを自動更新 ($STAMP)"
          git push

      - name: サマリーを出力
        if: always()
        run: |
          {
            echo "### ガチバトルピックAI / メタ更新"
            echo ""
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("rules/rules.json")
          if not p.exists():
              print("rules.json が生成されていません")
              raise SystemExit
          d = json.loads(p.read_text(encoding="utf-8"))
          q = d["dataQuality"]
          print(f"- 生成時刻: `{d['generatedAt']}`")
          print(f"- マップ数: **{len(d['maps'])}**")
          print(f"- 実測勝率: **{'あり' if q['liveStats'] else 'なし'}**"
                f" ({q['mapsWithLiveStats']} マップ)")
          print(f"- 手動ティア: **{q.get('manualTiers', 0)} 件**"
                f" / 同点の解消方法: `{q.get('tiebreak', '?')}`")
          print(f"- ローテ判明: **{'はい' if q['rotationKnown'] else 'いいえ'}**"
                f" (取得元: `{q.get('rotationSource', 'none')}`)")
          if not q["liveStats"]:
              print("")
              print("> 実測勝率が取れていません。Cloudflare が TLS フィンガープリントで"
                    "弾くため、ヘッダ調整では回避できません。README §8 を参照。")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
