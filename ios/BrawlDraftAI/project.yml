name: BrawlDraftAI

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # チーム募集（CloudKit）は Apple Developer 側で iCloud を有効にしてから
    # Local.xcconfig で切り替える（README「チーム募集のセットアップ」）。未設定でもビルドは通る。
    BDA_ENTITLEMENTS: Sources/BrawlDraftAI.entitlements
    BDA_SWIFT_FLAGS: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  BrawlDraftAI:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # 署名まわり（DEVELOPMENT_TEAM / バンドル ID）は Local.xcconfig に置く。
    # project.yml に書くと GitHub に載ってしまい、ここに書かないと
    # xcodegen generate のたびに Xcode 上の設定が消えるため。
    # Local.xcconfig は scripts/setup_ios.sh が作る（.gitignore 済み）。
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_NAME: BrawlDraftAI
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"   # v1.0 は iPhone のみ（iPad 用の画面と審査用スクリーンショットは未対応）
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(BDA_ENTITLEMENTS)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(BDA_SWIFT_FLAGS)
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - sdk: AppIntents.framework
      - sdk: Photos.framework
      - sdk: AVFoundation.framework
      - sdk: UserNotifications.framework
      - sdk: Accelerate.framework
      - sdk: Speech.framework
      - sdk: CloudKit.framework
      - sdk: MetalKit.framework
