name: BrawlDraftAI

# Personal は自分の端末に入れる専用の構成（中身は Release と同じ最適化）。
# この構成だけ REAL_ICONS が有効になり、ゲーム本物のキャラ・マップ画像を表示する。
# App Store に出すのは Release だけ（審査 4.1(a) で本物の画像は却下されたため）。
configs:
  Debug: debug
  Release: release
  Personal: release

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  BrawlDraftAI:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # 署名まわり（DEVELOPMENT_TEAM / バンドル ID）は Local.xcconfig に置く。
    # project.yml に書くと GitHub に載ってしまい、ここに書かないと
    # xcodegen generate のたびに Xcode 上の設定が消えるため。
    # Local.xcconfig は scripts/setup_ios.sh が作る（.gitignore 済み）。
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
      Personal: Local.xcconfig
    settings:
      base:
        PRODUCT_NAME: BrawlDraftAI
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"   # v1.0 は iPhone のみ（iPad 用の画面と審査用スクリーンショットは未対応）
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/BrawlDraftAI.entitlements
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Personal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) REAL_ICONS"
    dependencies:
      - sdk: AppIntents.framework
      - sdk: Photos.framework
      - sdk: AVFoundation.framework
      - sdk: UserNotifications.framework
      - sdk: Accelerate.framework
      - sdk: MetalKit.framework
